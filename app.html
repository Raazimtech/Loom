<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173c2b"><meta name="description" content="Lunar turns long-term goals into clear daily actions."><title>Lunar</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon-192.svg"><link rel="apple-touch-icon" href="./icon-192.svg"><style>:root{--g:#173c2b;--g2:#2e674a;--bg:#f4f6f1;--card:#fff;--ink:#17231c;--muted:#718078;--line:#dfe5df;--danger:#a65050}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100dvh;max-width:1180px;margin:auto;padding-bottom:92px}.header{padding:22px 18px 8px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:850;font-size:21px}.brand img{width:34px;height:34px}.content{padding:16px 18px}.view{display:none}.view.active{display:block}.muted{color:var(--muted)}h1{font-size:34px;letter-spacing:-.04em;margin:10px 0}h2{font-size:25px;letter-spacing:-.03em;margin:0 0 14px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--g2)}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.stat b{display:block;font-size:28px;margin-top:7px}.progress{height:8px;background:#e5ebe5;border-radius:10px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--g);border-radius:inherit}.task{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:9px}.task-main{flex:1;min-width:0}.task-title{font-weight:750}.task-meta{font-size:12px;color:var(--muted);margin-top:4px}.check{width:25px;height:25px;border-radius:50%;border:2px solid #91a097;background:transparent;flex:none}.check.done{background:var(--g);border-color:var(--g);position:relative}.check.done:after{content:'✓';color:white;position:absolute;font-size:15px;left:4px;top:0}.fab{position:fixed;z-index:5;left:50%;bottom:63px;transform:translateX(-50%);width:62px;height:62px;border:6px solid var(--bg);border-radius:20px;background:var(--g);color:#fff;font-size:30px;box-shadow:0 12px 28px #173c2b2b}.nav{position:fixed;z-index:4;bottom:0;left:0;right:0;height:72px;padding:7px 8px max(7px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;max-width:1180px;margin:auto}.nav button{border:0;background:none;color:#77847c;font-size:11px;font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav button.active{color:var(--g)}.nav .spacer{visibility:hidden}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:750}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:13px 14px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--g2);box-shadow:0 0 0 3px #2e674a14}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800}.primary{background:var(--g);color:white}.secondary{background:white;border:1px solid var(--line)}.danger{color:var(--danger)}.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}.authbox{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:25px;padding:26px;box-shadow:0 20px 60px #173c2b10}.authbox .brand{margin-bottom:26px}.error{color:var(--danger);font-size:13px;min-height:18px}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{padding:6px 9px;border-radius:9px;background:#edf2ed;color:var(--g2);font-size:11px;font-weight:800}@media(min-width:800px){.content{padding:26px 28px}.stats{grid-template-columns:repeat(4,1fr)}.nav{position:fixed;left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100% - 40px));border:1px solid var(--line);border-radius:20px;bottom:16px}.fab{bottom:71px}.shell{padding-bottom:110px}}
</style></head><body><div id="auth" class="auth"><div class="authbox"><div class="brand"><img src="icon-192.svg" alt="Lunar">Lunar</div><div class="eyebrow">Your progress, in days</div><h1 id="authTitle">Welcome back.</h1><p id="authSubtitle" class="muted">Sign in to continue.</p><form id="authForm" class="form"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="24" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></div><div id="authError" class="error" role="alert"></div><button class="btn primary" id="authSubmit">Sign in</button><button type="button" class="btn secondary" id="toggleAuth">Create account</button></form></div></div><div id="app" class="shell" hidden><header class="header"><a class="brand" href="./"><img src="icon-192.svg" alt="Lunar">Lunar</a><span id="date" class="muted"></span></header><main class="content"><section id="home" class="view active"><div class="eyebrow">Today</div><h1 id="hello">Good to see you.</h1><p class="muted">Small actions compound.</p><div class="grid stats" id="stats"></div><div style="margin-top:28px" class="row"><h2>Today's actions</h2><span id="todayCount" class="pill"></span></div><div id="todayTasks"></div></section><section id="tasks" class="view"><div class="row"><div><div class="eyebrow">Your plan</div><h1>My Tasks</h1></div><button class="btn secondary" onclick="showView('create')">+ New</button></div><div id="allTasks" style="margin-top:20px"></div></section><section id="create" class="view"><div class="eyebrow">Build the routine</div><h1>Create</h1><form id="taskForm" class="form"><div class="card"><div class="field"><label>What are you working on?</label><input id="title" placeholder="Learn JavaScript" required maxlength="140"></div><div class="field"><label>Description</label><textarea id="description" rows="3" placeholder="What does success look like?"></textarea></div><div class="field"><label>Type</label><select id="type"><option value="one_time">One-time task</option><option value="recurring">Recurring routine</option><option value="goal">Long-term goal</option></select></div><div class="field"><label>Priority</label><select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div><div class="field"><label>Start date</label><input id="start" type="date" required></div><div class="field"><label>End date</label><input id="end" type="date"></div><div class="field"><label>Repeat</label><select id="repeat"><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option></select></div><button class="btn primary">Create plan</button></div></form></section><section id="evaluate" class="view"><div class="eyebrow">Reflect</div><h1>Evaluate</h1><p class="muted">A quick check-in makes the pattern visible.</p><form id="evalForm" class="form"><div class="card"><div class="field"><label>Mood (1–5)</label><input id="mood" type="number" min="1" max="5" value="4"></div><div class="field"><label>Focus (1–5)</label><input id="focus" type="number" min="1" max="5" value="4"></div><div class="field"><label>Energy (1–5)</label><input id="energy" type="number" min="1" max="5" value="4"></div><div class="field"><label>Reflection</label><textarea id="reflection" rows="5" placeholder="What helped today? What will you change tomorrow?"></textarea></div><button class="btn primary">Save evaluation</button></div></form></section><section id="profile" class="view"><div class="eyebrow">Account</div><h1>Profile</h1><div class="card"><div class="row"><div><b id="profileName">Username</b><div class="muted" id="profileSince"></div></div><span class="pill">Lunar</span></div></div><button id="logout" class="btn secondary" style="margin-top:14px;width:100%">Sign out</button></section></main><button class="fab" onclick="showView('create')" aria-label="Create">+</button><nav class="nav"><button data-view="home" class="active">⌂<span>Home</span></button><button data-view="tasks">✓<span>My Tasks</span></button><div class="spacer"></div><button data-view="evaluate">◌<span>Evaluate</span></button><button data-view="profile">○<span>Profile</span></button></nav></div><script type="module" src="./app.js"></script></body></html>
